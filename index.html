<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅遊帳本">
<meta name="theme-color" content="#1A73E8">
<title>旅遊帳本</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1d2330; --muted: #6b7380; --line: #e2e6ec;
    --brand: #1a73e8; --brand-ink: #ffffff; --brand-soft: #e8f0fd;
    --warn-bg: #fff6e0; --warn-ink: #7a5300; --dup-bg: #ffe9e3; --dup-ink: #8a2b12;
    --ok: #18794e; --danger: #c5221f; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #191d23; --text: #e8eaed; --muted: #9aa1ab; --line: #2b313a;
      --brand: #6aa3f8; --brand-ink: #0b1220; --brand-soft: #1b2a42;
      --warn-bg: #3a2f12; --warn-ink: #f2d38a; --dup-bg: #3d1f17; --dup-ink: #f5b5a3;
      --ok: #5fd39a; --danger: #f28b82; --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 12px 16px 40px; }
  .hidden { display: none !important; }

  header.top { display: flex; align-items: center; gap: 8px; padding: 6px 0 10px; }
  .trip-btn {
    flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 6px 0;
    font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .trip-btn small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); font-size: 20px; display: grid; place-items: center;
  }

  .card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 14px; }
  .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .totals .label { font-size: 13px; color: var(--muted); }
  .totals .num { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .totals .sub { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }

  .actions { display: grid; gap: 10px; margin-bottom: 14px; }
  .big {
    width: 100%; min-height: 64px; border-radius: 16px; border: 0; font-size: 19px; font-weight: 700;
    background: var(--brand); color: var(--brand-ink); display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .big.secondary { background: var(--card); color: var(--text); border: 1px solid var(--line); min-height: 52px; font-size: 17px; font-weight: 600; }
  .big:active { transform: scale(.99); }

  h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 18px 4px 8px; }
  .recent { list-style: none; margin: 0; padding: 0; }
  .recent li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .recent li:last-child { border-bottom: 0; }
  .recent .store { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent .amt { font-weight: 700; font-variant-numeric: tabular-nums; }
  .recent .meta { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); padding: 8px 2px; }

  /* 全螢幕表單（記一筆、旅程、設定共用） */
  .sheet { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 10;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .sheet-head { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .sheet-head h1 { flex: 1; margin: 0; font-size: 18px; text-align: center; }
  .link-btn { background: none; border: 0; color: var(--brand); font-size: 17px; padding: 8px 4px; font-weight: 600; }

  .photo { display: block; width: 100%; max-height: 260px; object-fit: contain; background: #000; border-radius: 12px; }
  .status { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--brand-soft); margin: 10px 0; font-size: 15px; }
  .status.err { background: var(--dup-bg); color: var(--dup-ink); }
  .status.ok { background: transparent; padding: 4px 2px; color: var(--muted); font-size: 13px; }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--brand); border-right-color: transparent; animation: spin 0.9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .note { padding: 10px 12px; border-radius: 12px; margin: 8px 0; font-size: 14px; }
  .note.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .note.dup { background: var(--dup-bg); color: var(--dup-ink); }

  .field { margin: 12px 0; }
  .field > label, .label-row { display: block; font-size: 13px; color: var(--muted); margin: 0 2px 6px; }
  .field input, .field select, .field textarea {
    width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); font-size: 17px;
  }
  .field textarea { min-height: 88px; resize: vertical; line-height: 1.45; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row.amount { grid-template-columns: 1.6fr 1fr; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line); background: var(--card); font-size: 16px; }
  .chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 700; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 22px; }
  .stepper output { min-width: 40px; text-align: center; font-size: 20px; font-weight: 700; }
  .calc { font-size: 14px; color: var(--muted); margin: 6px 2px 0; font-variant-numeric: tabular-nums; }
  .calc b { color: var(--text); font-size: 18px; }
  .save-bar { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); }

  .trip-list { list-style: none; margin: 0; padding: 0; }
  .trip-list button { width: 100%; text-align: left; min-height: 52px; padding: 0 14px; margin-bottom: 8px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); font-size: 17px; }
  .trip-list button[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); font-weight: 700; }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 2px; }
  .ver { font-size: 12px; color: var(--muted); text-align: center; margin-top: 24px; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #1d2330; color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 15px; z-index: 30;
    max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  @media (prefers-color-scheme: dark) { .toast { background: #e8eaed; color: #111; } }
  .guide { background: var(--brand-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; }
  .guide ol { margin: 6px 0 0; padding-left: 20px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 第一次使用：輸入密碼與名字 -->
  <section id="login" class="hidden">
    <h1 style="font-size:24px;margin:24px 0 6px">旅遊帳本</h1>
    <p class="hint" style="font-size:15px;margin-bottom:16px">拍收據就記帳，全家共用同一本。</p>
    <div id="installGuide" class="guide hidden">
      建議先放到主畫面，之後一鍵打開：
      <ol><li>按 Safari 下方的「分享」</li><li>選「加入主畫面」</li><li>從主畫面的「旅遊帳本」打開，再輸入下面的密碼</li></ol>
    </div>
    <div class="field"><label for="loginPass">密碼（問 Gary）</label>
      <input id="loginPass" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text"></div>
    <div class="field"><label for="loginName">你的名字（記錄人）</label>
      <input id="loginName" autocomplete="nickname" placeholder="例如：Gary"></div>
    <p id="loginErr" class="note dup hidden"></p>
    <button id="loginBtn" class="big">開始使用</button>
  </section>

  <!-- 主畫面 -->
  <section id="main" class="hidden">
    <header class="top">
      <button id="tripBtn" class="trip-btn" aria-label="切換旅程"><small>目前旅程 ▾</small><span id="tripName">—</span></button>
      <button id="settingsBtn" class="icon-btn" aria-label="設定">⚙︎</button>
    </header>
    <div class="card totals">
      <div><div class="label">今天</div><div class="num" id="sumToday">NT$0</div></div>
      <div><div class="label">這趟</div><div class="num" id="sumTrip">NT$0</div></div>
      <div class="sub" id="sumCount">0 筆</div>
    </div>
    <div class="actions">
      <button id="scanBtn" class="big">📷 拍收據</button>
      <button id="manualBtn" class="big secondary">✍️ 手動記一筆</button>
      <input id="fileInput" type="file" accept="image/*,application/pdf" class="hidden">
    </div>
    <h2>最近記的</h2>
    <div class="card" style="padding-top:4px;padding-bottom:4px"><ul id="recent" class="recent"></ul></div>
  </section>
</div>

<!-- 記一筆 -->
<section id="entry" class="sheet hidden" aria-label="記一筆">
  <div class="sheet-head">
    <button id="entryCancel" class="link-btn">取消</button>
    <h1 id="entryTitle">記一筆</h1>
    <span style="width:40px"></span>
  </div>
  <div class="wrap">
    <img id="photo" class="photo hidden" alt="收據照片">
    <div id="status" class="status hidden"></div>
    <div id="notes"></div>

    <div class="field"><label for="fStore">店名</label><input id="fStore" autocomplete="off"></div>
    <div class="row">
      <div class="field"><label for="fDate">日期</label><input id="fDate" type="date"></div>
      <div class="field"><label for="fTime">時間</label><input id="fTime" type="time"></div>
    </div>
    <div class="field"><span class="label-row">分類</span><div id="fCategory" class="chips"></div></div>
    <div class="row amount">
      <div class="field"><label for="fAmount">金額</label><input id="fAmount" type="number" inputmode="decimal" step="any" min="0"></div>
      <div class="field"><label for="fCurrency">幣別</label><select id="fCurrency"></select></div>
    </div>
    <div class="row">
      <div class="field"><label for="fRate">匯率（→台幣）</label><input id="fRate" type="number" inputmode="decimal" step="any" min="0"></div>
      <div class="field"><span class="label-row">分攤人數</span>
        <div class="stepper"><button id="pMinus" type="button" aria-label="減一人">−</button><output id="fPeople">3</output><button id="pPlus" type="button" aria-label="加一人">＋</button></div>
      </div>
    </div>
    <p class="calc" id="calc"></p>
    <div class="field"><label for="fPayment">付款</label><select id="fPayment"></select></div>
    <div class="field"><label for="fItems">品項</label><textarea id="fItems" rows="3"></textarea></div>
    <div class="field"><label for="fNotes">備註</label><input id="fNotes" autocomplete="off"></div>
    <div class="save-bar"><button id="saveBtn" class="big">儲存</button></div>
  </div>
</section>

<!-- 旅程 -->
<section id="trips" class="sheet hidden" aria-label="切換旅程">
  <div class="sheet-head"><button id="tripsClose" class="link-btn">完成</button><h1>旅程</h1><span style="width:44px"></span></div>
  <div class="wrap">
    <p class="hint">全家共用同一個「目前旅程」，切換後大家拍的都記到這一趟。</p>
    <ul id="tripList" class="trip-list"></ul>
    <div class="field"><label for="newTrip">新的一趟</label><input id="newTrip" placeholder="例如：2027_日本_1月" autocomplete="off"></div>
    <button id="addTrip" class="big secondary">開新旅程</button>
  </div>
</section>

<!-- 設定 -->
<section id="settings" class="sheet hidden" aria-label="設定">
  <div class="sheet-head"><button id="settingsClose" class="link-btn">完成</button><h1>設定</h1><span style="width:44px"></span></div>
  <div class="wrap">
    <div class="field"><label for="setName">你的名字（記錄人）</label><input id="setName" autocomplete="nickname"></div>
    <div class="field"><label for="setPass">密碼</label><input id="setPass" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <button id="setSave" class="big secondary">儲存設定</button>
    <p class="hint" style="margin-top:18px">帳目都在 Google 試算表「旅遊帳本」：總覽、每日小計、明細都看得到，也可以直接改。</p>
    <button id="forceUpdate" class="big secondary" style="margin-top:12px">重新載入最新版</button>
    <p class="ver" id="ver"></p>
  </div>
</section>

<div id="toast" class="toast hidden" role="status"></div>

<script>
'use strict';
const APP_VERSION = 'v2';
const API = 'https://script.google.com/macros/s/AKfycbz9rJgnHSJwmoqx8yxhwnhv8Ys3iE50E7V4bGauelbAJNlCNO0jWVXBTEnqpq5883I4/exec';
const CURRENCIES = ['JPY', 'TWD', 'USD', 'KRW', 'EUR', 'HKD', 'THB', 'SGD', 'CNY', 'GBP', 'AUD', 'VND', 'MYR', 'PHP', 'CAD', 'NZD', 'CHF'];
const MAX_SIDE = 2000;   // 上傳前縮圖：收據小字仍清楚，檔案約 0.7 MB

const $ = id => document.getElementById(id);
const store = {
  get(k, d = '') { try { const v = localStorage.getItem('ledger.' + k); return v === null ? d : v; } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem('ledger.' + k, v); } catch (_) { /* 無痕模式 */ } },
  del(k) { try { localStorage.removeItem('ledger.' + k); } catch (_) { /* 無痕模式 */ } },
};

let cfg = null;      // 伺服器設定：目前旅程、預設人數、選單、合計
let entry = null;    // 正在填的這一筆
let seq = 0;
let lastSync = 0;    // 上次跟伺服器對時（抓目前旅程與合計）的時間

const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmt = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
const fmtLocal = (n, cur) => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: ['JPY', 'TWD', 'KRW', 'VND'].includes(cur) ? 0 : 2 });
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------------- 呼叫後端（Apps Script） ----------------
async function api(action, payload = {}, timeoutMs = 30000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    // text/plain 是「簡單請求」，不會觸發 CORS 預檢；Apps Script 會 302 轉到可跨域讀的網址
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, pass: store.get('pass'), today: today() }, payload)),
      signal: ctrl.signal,
    });
    return await res.json();
  } catch (err) {
    if (err.name === 'AbortError') return { ok: false, error: '等太久沒有回應' };
    return { ok: false, error: navigator.onLine ? '連不上伺服器' : '目前沒有網路' };
  } finally {
    clearTimeout(timer);
  }
}

// ---------------- 畫面切換 ----------------
function show(id) { $(id).classList.remove('hidden'); }
function hide(id) { $(id).classList.add('hidden'); }

let toastTimer = 0;
function toast(msg, ms = 2600) {
  const t = $('toast');
  t.textContent = msg;
  show('toast');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => hide('toast'), ms);
}

function hashParams() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  return { k: h.get('k') || '', n: h.get('n') || '' };
}

function showLogin(msg) {
  hide('main');
  show('login');
  $('loginPass').value = store.get('pass');
  $('loginName').value = store.get('name');
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  $('installGuide').classList.toggle('hidden', standalone || !/iPhone|iPad/.test(navigator.userAgent));
  $('loginErr').textContent = msg || '';
  $('loginErr').classList.toggle('hidden', !msg);
}

async function doLogin() {
  const pass = $('loginPass').value.trim();
  const name = $('loginName').value.trim();
  if (!pass || !name) return showLogin(!pass ? '請輸入密碼' : '請輸入名字');
  store.set('pass', pass);
  store.set('name', name);
  busy($('loginBtn'), true, '連線中…');
  const r = await api('config');
  busy($('loginBtn'), false);
  if (!r.ok) return showLogin(r.code === 'auth' ? '密碼不對' : r.error);
  applyConfig(r);
  hide('login');
  show('main');
}

function busy(btn, on, label) {
  if (on) { btn.dataset.label = btn.textContent; btn.textContent = label || '處理中…'; btn.disabled = true; }
  else { btn.textContent = btn.dataset.label || btn.textContent; btn.disabled = false; }
}

// ---------------- 主畫面 ----------------
function applyConfig(r) {
  cfg = r;
  store.set('cfg', JSON.stringify(r));
  $('tripName').textContent = r.trip || '還沒有旅程，點這裡開一趟';
  renderTotals(r.totals);
  renderRecent(r.recent);
}

function renderTotals(t) {
  t = t || { today: 0, trip: 0, count: 0 };
  $('sumToday').textContent = 'NT$' + fmt(t.today);
  $('sumTrip').textContent = 'NT$' + fmt(t.trip);
  $('sumCount').textContent = `這趟共 ${t.count} 筆`;
}

function renderRecent(list) {
  const ul = $('recent');
  if (!list || !list.length) { ul.innerHTML = '<li class="empty">還沒有紀錄</li>'; return; }
  ul.innerHTML = list.map(x => `<li><span class="store">${esc(x.store)}</span><span class="amt">NT$${fmt(x.twd)}</span>` +
    `<span class="meta">${esc(x.date.slice(5).replace('-', '/'))} ${esc(x.time)} · ${esc(x.category)}${x.recorder ? ' · ' + esc(x.recorder) : ''}</span></li>`).join('');
}

// quiet：從背景切回來時自動跑的，失敗就算了（例如在國外沒網路），不跳訊息
async function refresh(quiet) {
  lastSync = Date.now();
  const before = cfg && cfg.trip;
  const r = await api('config');
  if (r.ok) {
    applyConfig(r);
    if (before && r.trip && r.trip !== before) toast(`目前旅程已換成「${r.trip}」`, 4000);
  } else if (quiet) return;
  else if (r.code === 'auth') showLogin('密碼不對，請重新輸入');
  else toast('沒更新到最新合計：' + r.error);
}

// 伺服器回報的目前旅程跟畫面上的不一樣（家人換了旅程）：更新畫面，回傳有沒有換
function syncTrip(trip) {
  if (!trip || !cfg || trip === cfg.trip) return false;
  cfg.trip = trip;
  $('tripName').textContent = trip;
  store.set('cfg', JSON.stringify(cfg));
  return true;
}

// 從背景切回來：重抓目前旅程與合計（家人可能換了旅程或剛記了帳），順便檢查網頁有沒有新版
function resync() {
  if (document.visibilityState !== 'visible' || $('main').classList.contains('hidden')) return;
  if (Date.now() - lastSync < 30000) return;
  refresh(true);
  if (navigator.serviceWorker) navigator.serviceWorker.getRegistration().then(reg => reg && reg.update()).catch(() => {});
}

// ---------------- 記一筆 ----------------
function setVal(id, v) { $(id).value = v == null ? '' : v; }

function buildSelects() {
  const curSel = $('fCurrency');
  curSel.innerHTML = CURRENCIES.map(c => `<option>${c}</option>`).join('');
  const paySel = $('fPayment');
  paySel.innerHTML = (cfg && cfg.payments || ['現金', '信用卡', '其他', '不明']).map(p => `<option>${esc(p)}</option>`).join('');
  const chips = $('fCategory');
  chips.innerHTML = (cfg && cfg.categories || ['餐飲', '交通', '住宿', '購物', '景點', '其他'])
    .map(c => `<button type="button" class="chip" aria-pressed="false" data-v="${esc(c)}">${esc(c)}</button>`).join('');
}

function ensureCurrency(cur) {
  if (!cur) return;
  const sel = $('fCurrency');
  if (![...sel.options].some(o => o.value === cur)) sel.insertAdjacentHTML('afterbegin', `<option>${esc(cur)}</option>`);
  sel.value = cur;
}

function setCategory(v) {
  [...$('fCategory').children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
}
function getCategory() {
  const b = [...$('fCategory').children].find(x => x.getAttribute('aria-pressed') === 'true');
  return b ? b.dataset.v : '其他';
}
function setPeople(n) { $('fPeople').value = $('fPeople').textContent = String(Math.max(1, Math.min(20, n))); }
function getPeople() { return Number($('fPeople').textContent) || 1; }

function openEntry(withPhoto) {
  buildSelects();
  entry = { seq: ++seq, fileId: '', dirty: new Set(), rateTouched: false, image: null, started: Date.now() };
  $('entryTitle').textContent = withPhoto ? '拍收據' : '手動記一筆';
  setVal('fStore', '');
  setVal('fDate', today());
  setVal('fTime', withPhoto ? '' : nowTime());
  setCategory(withPhoto ? '' : '餐飲');
  setVal('fAmount', '');
  ensureCurrency((cfg && cfg.currency) || 'JPY');
  setVal('fRate', '');
  setPeople((cfg && cfg.people) || 3);
  setVal('fPayment', withPhoto ? '不明' : '現金');
  setVal('fItems', '');
  setVal('fNotes', '');
  $('photo').removeAttribute('src');
  hide('photo');
  hide('status');
  $('notes').innerHTML = '';
  updateCalc();
  show('entry');
  $('entry').scrollTop = 0;
  if (!withPhoto) fetchRate();
}

function closeEntry() {
  hide('entry');
  if (entry && entry.timer) clearInterval(entry.timer);
  entry = null;
  store.del('draft');
}

function setStatus(kind, text) {
  const s = $('status');
  if (entry && entry.timer) { clearInterval(entry.timer); entry.timer = 0; }
  s.className = 'status' + (kind === 'err' ? ' err' : kind === 'ok' ? ' ok' : '');
  s.innerHTML = (kind === 'loading' ? '<span class="spinner"></span>' : '') + `<span>${esc(text)}</span>`;
  show('status');
}

function startCountdown(label) {
  const t0 = Date.now();
  setStatus('loading', label);
  entry.timer = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000);
    $('status').lastChild.textContent = `${label}（${s} 秒）`;
  }, 1000);
}

function renderNotes(checks, dups) {
  const parts = [];
  (dups || []).forEach(d => parts.push(`<p class="note dup">同一天已經有一筆 ${esc(d.currency)} ${fmtLocal(d.amount, d.currency)}` +
    `（${esc(d.store)}${d.time ? ' ' + esc(d.time) : ''}${d.recorder ? '，' + esc(d.recorder) + ' 記的' : ''}）。如果是同一張收據，請按左上角取消。</p>`));
  (checks || []).forEach(c => parts.push(`<p class="note warn">⚠️ ${esc(c)}</p>`));
  $('notes').innerHTML = parts.join('');
}

function updateCalc() {
  const amt = Number($('fAmount').value);
  const rate = Number($('fRate').value);
  if (!(amt > 0) || !(rate > 0)) { $('calc').textContent = ''; return; }
  const twd = Math.round(amt * rate);
  const p = getPeople();
  $('calc').innerHTML = `台幣 <b>NT$${fmt(twd)}</b>` + (p > 1 ? `　每人 NT$${fmt(twd / p)}` : '');
}

let rateTimer = 0;
function fetchRate() {
  if (!entry || entry.rateTouched) return;
  clearTimeout(rateTimer);
  rateTimer = setTimeout(async () => {
    const mySeq = entry && entry.seq;
    const cur = $('fCurrency').value;
    if (cur === 'TWD') { setVal('fRate', 1); updateCalc(); return; }
    const r = await api('rate', { currency: cur, date: $('fDate').value });
    if (!entry || entry.seq !== mySeq || entry.rateTouched) return;
    if (r.ok && r.rate) { setVal('fRate', r.rate); updateCalc(); saveDraft(); }
  }, 300);
}

function fillFromReceipt(rc) {
  const put = (id, key, v) => { if (!entry.dirty.has(key) && v !== '' && v != null) setVal(id, v); };
  put('fStore', 'store', rc.store);
  put('fDate', 'date', rc.date);
  put('fTime', 'time', rc.time);
  if (!entry.dirty.has('category')) setCategory(rc.category);
  put('fAmount', 'amount', rc.total);
  if (!entry.dirty.has('currency') && rc.currency) ensureCurrency(rc.currency);
  if (!entry.dirty.has('payment') && rc.payment) {
    if (![...$('fPayment').options].some(o => o.value === rc.payment)) $('fPayment').insertAdjacentHTML('beforeend', `<option>${esc(rc.payment)}</option>`);
    setVal('fPayment', rc.payment);
  }
  put('fItems', 'items', rc.itemsText);
  if (!entry.rateTouched) {
    if (rc.rate) setVal('fRate', rc.rate);
    else fetchRate();
  }
  autosize($('fItems'));
  updateCalc();
  saveDraft();
}

// 縮圖成 JPEG；PDF 或瀏覽器解不開的格式就原檔上傳（Gemini 讀得了 HEIC、PDF）
async function prepImage(file) {
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
    return { b64: await blobToB64(file), mime: 'application/pdf', preview: '' };
  }
  try {
    const src = await decodeImage(file);
    const scale = Math.min(1, MAX_SIDE / Math.max(src.width, src.height));
    const w = Math.round(src.width * scale), h = Math.round(src.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(src, 0, 0, w, h);
    const blob = await new Promise((res, rej) => canvas.toBlob(b => (b ? res(b) : rej(new Error('toBlob'))), 'image/jpeg', 0.85));
    return { b64: await blobToB64(blob), mime: 'image/jpeg', preview: URL.createObjectURL(blob) };
  } catch (_) {
    return { b64: await blobToB64(file), mime: file.type || 'image/jpeg', preview: '' };
  }
}

async function decodeImage(file) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (_) { /* 改用 <img> */ }
  }
  const img = new Image();
  img.src = URL.createObjectURL(file);
  await img.decode();
  return img;
}

function blobToB64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}

async function onFile(file) {
  if (!file) return;
  if (!cfg || !cfg.trip) { toast('先開一趟旅程再拍'); openTrips(); return; }
  openEntry(true);
  const mySeq = entry.seq;
  setStatus('loading', '準備照片…');
  let img;
  try { img = await prepImage(file); } catch (_) { setStatus('err', '讀不到這張照片，換一張或手動填'); return; }
  if (!entry || entry.seq !== mySeq) return;
  entry.image = img;
  if (img.preview) { $('photo').src = img.preview; show('photo'); }
  startCountdown('上傳並辨識中');
  const r = await api('scan', { image: img.b64, mime: img.mime }, 120000);
  if (!entry || entry.seq !== mySeq) {          // 使用者在等待時按了取消
    if (r.ok && r.fileId) api('cancel', { fileId: r.fileId });
    return;
  }
  if (!r.ok) { setStatus('err', `${r.code === 'auth' ? '密碼不對' : r.error}。可以直接手動填，存的時候會一起附上照片。`); return; }
  if (syncTrip(r.trip)) toast(`目前旅程已換成「${r.trip}」，這筆會記在那趟`, 4000);
  entry.fileId = r.fileId;
  entry.image = null;   // 照片已經在雲端
  if (!r.receipt) { setStatus('err', r.error || '沒辨識出來，請手動填'); saveDraft(); return; }
  const rc = r.receipt;
  if (!rc.total && !rc.date) {
    setStatus('err', '這張看不出是收據，可以手動填，或按取消重拍。');
    saveDraft();
    return;
  }
  fillFromReceipt(rc);
  const secs = Math.round((Date.now() - entry.started) / 1000);
  setStatus('ok', `辨識完成，花了 ${secs} 秒。請核對一下再存。`);
  renderNotes(r.receipt.checks, r.receipt.duplicates);
}

function collect() {
  return {
    store: $('fStore').value.trim(),
    date: $('fDate').value,
    time: $('fTime').value,
    category: getCategory(),
    amount: $('fAmount').value === '' ? '' : Number($('fAmount').value),
    currency: $('fCurrency').value,
    rate: $('fRate').value === '' ? '' : Number($('fRate').value),
    people: getPeople(),
    payment: $('fPayment').value,
    items: $('fItems').value.trim(),
    notes: $('fNotes').value.trim(),
  };
}

async function save() {
  if (!entry) return;
  const f = collect();
  if (!f.date) return toast('請填日期');
  if (f.amount === '' || !(f.amount >= 0)) return toast('請填金額');
  const btn = $('saveBtn');
  busy(btn, true, '儲存中…');
  // 不送旅程：記到哪一趟由伺服器照目前旅程決定
  const payload = { fields: f, fileId: entry.fileId, recorder: store.get('name') };
  if (!entry.fileId && entry.image) { payload.image = entry.image.b64; payload.mime = entry.image.mime; }
  const r = await api('save', payload, 60000);
  busy(btn, false);
  if (!r.ok) { toast('沒存成功：' + (r.code === 'auth' ? '密碼不對' : r.error), 4000); return; }
  const twd = f.rate > 0 ? Math.round(f.amount * f.rate) : 0;
  const moved = syncTrip(r.trip);
  closeEntry();
  if (moved) toast(`✓ 已記到「${r.trip}」（目前旅程已換）`, 4000);
  else toast(`✓ 已記：${f.store || '一筆'}${twd ? ' NT$' + fmt(twd) : ''}`);
  renderTotals(r.totals);
  renderRecent(r.recent);
  if (cfg) { cfg.totals = r.totals; cfg.recent = r.recent; store.set('cfg', JSON.stringify(cfg)); }
  if (moved) refresh(true);   // 旅程清單也跟著更新
}

function cancelEntry() {
  if (entry && entry.fileId) api('cancel', { fileId: entry.fileId });
  closeEntry();
}

// 手機可能在背景把網頁收掉：沒存的那筆先記在本機
function saveDraft() {
  if (!entry) return;
  store.set('draft', JSON.stringify({ t: Date.now(), fileId: entry.fileId, fields: collect(), rateTouched: entry.rateTouched }));
}

function restoreDraft() {
  let d;
  try { d = JSON.parse(store.get('draft') || 'null'); } catch (_) { d = null; }
  if (!d || Date.now() - d.t > 2 * 86400000) { store.del('draft'); return; }
  openEntry(false);
  const f = d.fields;
  entry.fileId = d.fileId || '';
  entry.rateTouched = !!d.rateTouched;
  setVal('fStore', f.store); setVal('fDate', f.date); setVal('fTime', f.time); setCategory(f.category);
  setVal('fAmount', f.amount); ensureCurrency(f.currency); setVal('fRate', f.rate); setPeople(f.people);
  setVal('fPayment', f.payment); setVal('fItems', f.items); setVal('fNotes', f.notes);
  ['store', 'date', 'time', 'category', 'amount', 'currency', 'payment', 'items'].forEach(k => entry.dirty.add(k));
  autosize($('fItems'));
  updateCalc();
  setStatus('ok', '這是上次還沒存的那一筆，核對後按儲存，不要就按取消。');
}

function autosize(t) { t.style.height = 'auto'; t.style.height = Math.min(360, t.scrollHeight + 2) + 'px'; }

// ---------------- 旅程 ----------------
function openTrips() {
  const list = (cfg && cfg.trips) || [];
  $('tripList').innerHTML = list.length
    ? list.map(t => `<li><button type="button" data-trip="${esc(t)}" aria-pressed="${cfg && t === cfg.trip}">${esc(t)}</button></li>`).join('')
    : '<li class="empty">還沒有旅程</li>';
  const d = new Date();
  $('newTrip').placeholder = `例如：${d.getFullYear()}_日本_${d.getMonth() + 1}月`;
  setVal('newTrip', '');
  show('trips');
}

async function switchTrip(name) {
  name = String(name || '').trim();
  if (!name) return toast('請輸入旅程名稱');
  const r = await api('trip', { trip: name });
  if (!r.ok) return toast('沒切換成功：' + r.error);
  hide('trips');
  syncTrip(r.trip);   // 先換掉畫面上的，下面 refresh 才不會再跳一次「已換成」
  toast('目前旅程：' + r.trip);
  await refresh();
}

// ---------------- 設定 ----------------
function openSettings() {
  setVal('setName', store.get('name'));
  setVal('setPass', store.get('pass'));
  show('settings');
}

async function saveSettings() {
  const name = $('setName').value.trim();
  const pass = $('setPass').value.trim();
  if (!name || !pass) return toast('名字和密碼都要填');
  store.set('name', name);
  store.set('pass', pass);
  hide('settings');
  await refresh();
  toast('設定已儲存');
}

async function forceUpdate() {
  try {
    const regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : [];
    await Promise.all(regs.map(r => r.unregister()));
    const keys = window.caches ? await caches.keys() : [];
    await Promise.all(keys.map(k => caches.delete(k)));
  } catch (_) { /* 照樣重新載入 */ }
  location.replace(location.pathname + '?u=' + Date.now());
}

// ---------------- 啟動 ----------------
function wire() {
  $('loginBtn').onclick = doLogin;
  $('scanBtn').onclick = () => { $('fileInput').value = ''; $('fileInput').click(); };
  $('fileInput').onchange = e => onFile(e.target.files && e.target.files[0]);
  $('manualBtn').onclick = () => { if (!cfg || !cfg.trip) { toast('先開一趟旅程'); openTrips(); return; } openEntry(false); };
  $('entryCancel').onclick = cancelEntry;
  $('saveBtn').onclick = save;
  $('tripBtn').onclick = openTrips;
  $('tripsClose').onclick = () => hide('trips');
  $('tripList').onclick = e => { const b = e.target.closest('button[data-trip]'); if (b) switchTrip(b.dataset.trip); };
  $('addTrip').onclick = () => switchTrip($('newTrip').value);
  $('settingsBtn').onclick = openSettings;
  $('settingsClose').onclick = () => hide('settings');
  $('setSave').onclick = saveSettings;
  $('forceUpdate').onclick = forceUpdate;
  document.addEventListener('visibilitychange', resync);
  window.addEventListener('pageshow', e => { if (e.persisted) resync(); });

  $('fCategory').onclick = e => {
    const b = e.target.closest('.chip');
    if (!b || !entry) return;
    setCategory(b.dataset.v);
    entry.dirty.add('category');
    saveDraft();
  };
  $('pMinus').onclick = () => { setPeople(getPeople() - 1); updateCalc(); saveDraft(); };
  $('pPlus').onclick = () => { setPeople(getPeople() + 1); updateCalc(); saveDraft(); };
  const mark = (id, key, after) => $(id).addEventListener('input', () => {
    if (!entry) return;
    entry.dirty.add(key);
    if (after) after();
    updateCalc();
    saveDraft();
  });
  mark('fStore', 'store');
  mark('fDate', 'date', fetchRate);
  mark('fTime', 'time');
  mark('fAmount', 'amount');
  mark('fCurrency', 'currency', () => { if (entry) entry.rateTouched = false; fetchRate(); });
  mark('fRate', 'rate', () => { if (entry) entry.rateTouched = true; });
  mark('fPayment', 'payment');
  mark('fItems', 'items', () => autosize($('fItems')));
  mark('fNotes', 'notes');
  $('fCurrency').addEventListener('change', () => { if (entry) { entry.dirty.add('currency'); entry.rateTouched = false; fetchRate(); } });
}

(function init() {
  $('ver').textContent = '版本 ' + APP_VERSION;
  wire();
  const h = hashParams();
  if (h.k) store.set('pass', h.k);
  if (h.n) store.set('name', h.n);
  if (!store.get('pass') || !store.get('name')) { showLogin(); return; }
  try { const c = JSON.parse(store.get('cfg') || 'null'); if (c) applyConfig(c); } catch (_) { /* 沒有快取就等伺服器 */ }
  show('main');
  restoreDraft();
  refresh();
})();

if ('serviceWorker' in navigator) {
  // updateViaCache:'none' 不能省：少了它 sw.js 會被瀏覽器快取，新版永遠裝不上
  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
    .then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          // 正在填的時候不要重新整理，等下次打開再換新版
          if (nw.state === 'installed' && navigator.serviceWorker.controller && !entry) location.reload();
        });
      });
    })
    .catch(() => {});
}
</script>
</body>
</html>
